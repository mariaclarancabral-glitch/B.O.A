<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Livros</title>

    <link rel="stylesheet" href="./cores_bli.css">
    <link rel="stylesheet" href="./cadastro_livro.css">

    <script src="js/cadastro.js" defer></script>

</head>

<body>

    <header>
        <h1>📚 Cadastro de Livros</h1>
        <p>Biblioteca Escolar</p>
    </header>

    <div class="container">

        <label>ISBN</label>
        <input type="text" id="isbn">

        <label>Título</label>
        <input type="text" id="titulo">

        <label>Autor</label>
        <input type="text" id="autor">

        <label>Gênero</label>

        <input type="text" id="genero" list="listaGeneros" placeholder="Digite ou pesquise um gênero">

        <datalist id="listaGeneros">

            <option value="Ação">
            <option value="Aventura">
            <option value="Autoajuda">
            <option value="Arte">
            <option value="Arquitetura">
            <option value="Astronomia">
            <option value="Biografia">
            <option value="Best Seller">
            <option value="Ciência">
            <option value="Ciência Política">
            <option value="Ciência da Computação">
            <option value="Clássico">
            <option value="Comédia">
            <option value="Conto">
            <option value="Crônica">
            <option value="Crime">
            <option value="Cyberpunk">
            <option value="Drama">
            <option value="Didático">
            <option value="Distopia">
            <option value="Economia">
            <option value="Educação">
            <option value="Ensaio">
            <option value="Esportes">
            <option value="Espiritualidade">
            <option value="Fantasia">
            <option value="Fantasia Épica">
            <option value="Fantasia Urbana">
            <option value="Ficção">
            <option value="Ficção Científica">
            <option value="Filosofia">
            <option value="Folclore">
            <option value="Geografia">
            <option value="Guerra">
            <option value="História">
            <option value="História do Brasil">
            <option value="HQ">
            <option value="Humor">
            <option value="Infantil">
            <option value="Juvenil">
            <option value="Jornalismo">
            <option value="Lendas">
            <option value="Literatura Brasileira">
            <option value="Literatura Estrangeira">
            <option value="Light Novel">
            <option value="Mangá">
            <option value="Mangá Shonen">
            <option value="Mangá Shojo">
            <option value="Mangá Seinen">
            <option value="Mangá Josei">
            <option value="Medicina">
            <option value="Mistério">
            <option value="Mitologia">
            <option value="Música">
            <option value="Negócios">
            <option value="Natureza">
            <option value="Paranormal">
            <option value="Policial">
            <option value="Poesia">
            <option value="Psicologia">
            <option value="Quadrinhos">
            <option value="Realismo">
            <option value="Religião">
            <option value="Romance">
            <option value="Romance Histórico">
            <option value="Romance Policial">
            <option value="Romance Juvenil">
            <option value="Romance Contemporâneo">
            <option value="Romance LGBTQIA+">
            <option value="Saúde">
            <option value="Suspense">
            <option value="Steampunk">
            <option value="Terror">
            <option value="Tecnologia">
            <option value="Thriller">
            <option value="Teatro">
            <option value="Turismo">
            <option value="Viagem">
            <option value="Western">
            <option value="Zumbi">

        </datalist>

        <label>Ano de Publicação</label>
        <input type="number" id="ano">

        <label>Idioma</label>

        <select id="idioma">
            <option>Português</option>
            <option>Inglês</option>
            <option>Espanhol</option>
            <option>Francês</option>
            <option>Alemão</option>
            <option>Italiano</option>
            <option>Japonês</option>
            <option>Coreano</option>
            <option>Chinês</option>
            <option>Russo</option>
        </select>

        <label>Editora</label>
        <input type="text" id="editora">

        <label>Localização da Estante</label>

        <input type="text" id="localizacao" placeholder="Ex: Estante A - Prateleira 2">

        <button class="salvar" onclick="salvarLivro()">
            💾 Salvar Livro
        </button>


    <!-- IMPORTAR LIVROS DO EXCEL -->

        <h2>📥 Importar livros</h2>

        <p>Selecione o arquivo CSV exportado do Excel:</p>

        <input type="file" id="arquivoExcel" accept=".csv">

        <button class="salvar" onclick="importarLivros()">
    📥 Importar Livros
    </button>

        <a href="bibliotecario.html">
            <button class="voltar">
                ⬅ Voltar
            </button>
        </a>

        <table>

            <thead>

                <tr>
                    <th>ISBN</th>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Ano</th>
                </tr>

            </thead>

            <tbody id="listaLivros">

            </tbody>

        </table>

    </div>



</body>

</html>
