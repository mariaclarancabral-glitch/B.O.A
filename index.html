<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B.O.A</title>

<link rel="stylesheet" href="css/cores_index.css">

<link rel="stylesheet" href="css/index.css">

<script src="js/index.js" defer></script>

</head>


<body>


<header>

<h1>📚 B.O.A</h1>

<p>(Biblioteca de Organização de Ajuda)</p>

</header>



<div class="container">


<div id="login">


<h2>Entrar</h2>


<label>E-mail</label>

<input
type="email"
id="emailLogin"
placeholder="Digite seu e-mail">



<label>Senha</label>

<input
type="password"
id="senhaLogin"
placeholder="Digite sua senha">



<label>Tipo de Usuário</label>

<select id="tipoLogin">


<option value="">
Selecione
</option>


<option value="aluno">
👨‍🎓 Aluno
</option>


<option value="professor">
👨‍🏫 Professor
</option>


<option value="bibliotecario">
📚 Bibliotecário
</option>


<option value="gestao">
🏫 Gestão
</option>


</select>




<button onclick="entrar()">

🔑 Entrar

</button>




<button 
class="secundario"
onclick="mostrarCadastro()">

📝 Criar Conta

</button>


</div>





<div id="cadastro" class="oculto">


<h2>Criar Conta</h2>




<label>Nome Completo</label>

<input
type="text"
id="nomeCadastro"
placeholder="Digite seu nome">





<label>E-mail</label>

<input
type="email"
id="emailCadastro"
placeholder="Digite seu e-mail">





<label>Senha</label>

<input
type="password"
id="senhaCadastro"
placeholder="Crie uma senha">





<label>Confirmar Senha</label>

<input
type="password"
id="confirmarSenha"
placeholder="Digite novamente a senha">





<label>Tipo de Usuário</label>


<select id="tipoCadastro">


<option value="">
Selecione
</option>


<option value="aluno">
👨‍🎓 Aluno
</option>


<option value="professor">
👨‍🏫 Professor
</option>


<option value="bibliotecario">
📚 Bibliotecário
</option>


<option value="gestao">
🏫 Gestão
</option>


</select>





<button onclick="cadastrar()">

💾 Criar Conta

</button>





<button 
class="secundario"
onclick="mostrarLogin()">

⬅ Voltar ao Login

</button>


</div>




<p id="mensagem"></p>


</div>


</body>

</html>
